<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Type</title>
<!-- 首帧绘制前恢复主题（存储不可用的 data: URL 环境退回系统深浅色），避免暗色用户看到白光一闪 -->
<script>try{var t=localStorage.getItem('type-theme');if(t==='dark'||(t===null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')}</script>
<!-- favicon：纸底墨字衬线 T，与界面配色一致 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23f4f0e6'/%3E%3Ctext x='24' y='33' font-family='Georgia,serif' font-size='28' font-weight='600' fill='%23272420' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
