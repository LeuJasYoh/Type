<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>{{STYLE}}</style>
</head>
<body>
<div class="window-caption">
  <span>KBType</span>
  <button id="btnPin" class="pin-btn" title="窗口置顶">
    <span id="pinLabel">置顶</span>
  </button>
</div>

<div class="app-container">
  <!-- 输入区域 -->
  <div class="section">
    <label class="section-label">输入要模拟键入的文本</label>
    <div class="input-wrap">
      <textarea id="textInput" placeholder="请输入文本..."></textarea>
      <div class="char-count"><span id="charCount">0</span> 个字符</div>
    </div>
  </div>

  <div class="options-row">
    <label class="checkbox-label">
      <input type="checkbox" id="chkForceRaw">
      <span class="checkbox-text">绕过粘贴检测</span>
    </label>
    <div class="delay-slider-row">
      <span class="slider-label">延迟</span>
      <input type="range" id="delaySlider" min="1" max="10" value="5" class="slider">
      <span id="delayValue" class="delay-value">5 秒</span>
    </div>
  </div>

  <div class="actions-row">
    <button id="btnStart" class="btn btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      启动
    </button>
    <button id="btnCancel" class="btn btn-secondary" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      取消
    </button>
  </div>

  <!-- 目标窗口预览 -->
  <div class="target-row" id="targetRow">
    <span class="target-label">目标窗口</span>
    <span class="target-name" id="targetName">—</span>
  </div>

  <!-- 状态与进度 -->
  <div class="status-bar" id="statusBar">
    <div class="status-text" id="statusText"></div>
  </div>
  <!-- 进度条 -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</div>

<script>{{SCRIPT}}</script>
</body>
</html>
