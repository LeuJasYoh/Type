name: 验证

# verify 抽成可复用工作流, 唯一的用处是让 ci.yml 与 release.yml 跑同一套检查。
#
# 为什么必须共用: 发版走的是"打标签"这条路, 而标签未必打在跑过 CI 的提交上
# (打标签的提交未必走过 main 的 CI)。此前 release.yml 只做 go test + 打包,
# 于是一份"改了 frontend/src 却忘了重新生成 internal/web/dist/index.html"的
# 提交照样能把 Release 发出去 —— exe 里嵌着与源码不符的旧界面, 谁都不会失败。
# 检查写在两处就会走散, 所以只有这一处。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          # Node 主版本只写在 .node-version 一处: 产品的字节级可复现性依赖它
          # (换主版本会改变 vite/rollup 产出的转义与 chunk 命名, 见产物漂移检查),
          # 开发者的 nvm/fnm 也读同一个文件, 两边不会各写一份而走散
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── Go 三件套 ──
      - name: gofmt
        shell: pwsh
        run: |
          $bad = gofmt -l ./cmd ./internal ./tools
          if ($bad) { Write-Host "以下文件未格式化:"; $bad; exit 1 }

      - name: go vet
        run: go vet ./...

      # -race 是刻意的: 状态机里出过"两次启动都通过判定、同一段文本注入两遍"
      # 这类只有并发交错才暴露的缺陷, 而行覆盖率看不到并发路径。Windows 上
      # 竞态检测需要 cgo, runner 自带 MinGW 的 gcc
      - name: go test
        run: go test -count=1 -race ./...

      # 漏洞扫描: 退出码就是判据 —— 可达的漏洞返回非零(构建失败), 只在依赖里
      # 存在而调不到的返回零(不算失败, 否则一个用不上的 CVE 就能卡住发版)。
      # 分析器钉住版本, 免得 releases 上冒出问题版本时构建莫名其妙地红
      - name: 漏洞扫描
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # 全部包的快速编译冒烟: 真正带资源链接的发布构建在 release.yml 里
      - name: go build
        run: go build ./...

      # build.ps1 的 UTF-8 BOM 是硬性不变量: Windows PowerShell 5.1 对无 BOM 的
      # .ps1 按系统 ANSI(中文系统为 GBK)解码, 中文注释的尾字节会吞掉换行, 把下一行
      # 代码并进注释成为死代码 —— ProductVersion 同步曾因此静默失效。部分编辑器与
      # 改写工具会顺手把 BOM 吞掉, 所以在 CI 里量一次首三字节
      - name: build.ps1 BOM 检查
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("scripts/build.ps1")
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "scripts/build.ps1 丢了 UTF-8 BOM (应为 EF BB BF): Windows PowerShell 5.1 会按 GBK 解码, 中文注释会吞掉换行"
          }
          Write-Host "build.ps1 的 UTF-8 BOM 在位"

      # ── 入库的前端产物必须与源码一致 ──
      # dist/index.html 入库是刻意的(免 Node 亦可 go build), 代价是改了
      # frontend/src 却忘了重新构建时 go:embed 会静默用旧界面, 这里堵住。
      # 比对用 git hash-object --path=<原路径>: 它套用与 git diff 相同的
      # 行尾归一, 因此 Windows 检出(autocrlf 使 CRLF)与 vite 产出(LF)
      # 不会误报, 而真实的内容漂移照样能被抓住(直接比字节或比哈希都会误报,
      # 第一版就是栽在这里)
      - name: 前端依赖
        run: npm ci
        working-directory: frontend

      # 前端单测: 轮询状态机(定时器 + IPC)靠打桩的 window/document 与假时钟驱动,
      # 不依赖 WebView2, 也不依赖真实时间。零新依赖 —— 用 Node 自带的测试跑器
      # 直接跑 TS(解析钩子见 frontend/test/ts-resolve.mjs)
      - name: 前端单测
        run: npm --prefix frontend test

      - name: 前端产物漂移检查
        shell: pwsh
        run: |
          $artifact = 'internal/web/dist/index.html'
          $committed = git rev-parse "HEAD:$artifact"
          if ($LASTEXITCODE -ne 0 -or -not $committed) {
            Write-Host "无法从 HEAD 读取入库产物 $artifact"; exit 1
          }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $built = git hash-object "--path=$artifact" $artifact
          if ($LASTEXITCODE -ne 0 -or -not $built) {
            Write-Host "重新构建未产出 $artifact"; exit 1
          }
          if ($built -ne $committed) {
            Write-Host "$artifact 与 frontend/src 不一致"
            Write-Host "  入库版本: $committed"
            Write-Host "  重新构建: $built"
            Write-Host "  环境: node $(node --version) / vite $((npm ls vite --depth=0 --json 2>$null | ConvertFrom-Json).dependencies.vite.version)"
            Write-Host "请在本地运行 scripts/build.ps1 并提交重新生成的产物"
            exit 1
          }
          Write-Host "前端产物与源码一致 ($committed)"

      - name: 版本同步检查
        shell: pwsh
        run: |
          # 与 build.ps1 同款正则: 版本可带预发布后缀(如 1.5.0-rc.1)
          # 用 ConvertFrom-Json 取字段本身, 而不是在文本里找子串:
          # 子串匹配在版本号恰好出现在别处时会漏判
          # 必须锚定行首的 `var version =` 且大小写敏感(与 build.ps1 同款): 无锚点的
          # 子串匹配会命中注释里的 `// version = "x"` 或将来某个 `minXxxVersion = "…"`
          $m = @(Select-String -Path cmd/type/main.go -CaseSensitive `
            -Pattern '(?m)^\s*var\s+version\s*=\s*"([\d.]+(?:-[0-9A-Za-z.]+)?)"')
          if ($m.Count -ne 1) { throw "cmd/type/main.go 里应恰好有一处 var version = ""x.y.z"" (实际 $($m.Count) 处)" }
          $ver = $m[0].Matches[0].Groups[1].Value
          $f = 'frontend/package.json'
          $pkg = Get-Content -Raw $f | ConvertFrom-Json
          if ($pkg.version -ne $ver) {
            Write-Host "$f 的 version = '$($pkg.version)', main.go 是 '$ver'"
            Write-Host "跑一次 scripts/build.ps1 让两边同步(它会重写 package.json 与 package-lock.json)"
            exit 1
          }
          # lock 的根版本长期没人管: 它曾停在 1.5.8, 而 package.json 早已是 1.6.1。
          # 刻意**不用 ConvertFrom-Json**: lock 里有一个空字符串键(npm 的根包条目
          # packages[""]), PS 5.1 遇到空键直接报 argument "name" is not valid(最小复现
          # '{"":"x"}' | ConvertFrom-Json), 与行数无关。这里取前两处 "version" 字面量 ——
          # 顶层与 packages[""] —— 与 build.ps1 的改写口径完全一致(它也有同款位置守卫),
          # 并核对顺序, 布局变了就明确失败而不是静默放过
          $lf = 'frontend/package-lock.json'
          $lk = [System.IO.File]::ReadAllText((Resolve-Path $lf))
          $mv = [regex]::Matches($lk, '(?m)^\s*"version"\s*:\s*"([^"]+)"')
          if ($mv.Count -lt 2) { throw "$lf 里找不到两处根版本(实际 $($mv.Count) 处): npm 换了 lock 格式?" }
          $packagesAt = $lk.IndexOf('"packages"')
          if ($packagesAt -lt 0 -or -not ($mv[0].Index -lt $packagesAt -and $mv[1].Index -gt $packagesAt)) {
            throw "$lf 的前两处 version 不是(顶层, packages[""])这个顺序: npm 换了 lock 布局?"
          }
          $lockRoot = $mv[0].Groups[1].Value
          $lockPkg = $mv[1].Groups[1].Value
          if ($lockRoot -ne $ver -or $lockPkg -ne $ver) {
            Write-Host "$lf 的根版本 = '$lockRoot' / '$lockPkg', main.go 是 '$ver'"
            Write-Host "跑一次 scripts/build.ps1 让两边同步(它会重写 lock 的两处根版本)"
            exit 1
          }
          Write-Host "版本号 $ver 已同步到 $f 与 $lf"
