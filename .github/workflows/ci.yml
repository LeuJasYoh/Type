name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 全流程在 Windows 上跑: 产品代码带 windows && (amd64 || arm64) 构建约束,
# 且 internal/win32 的测试里有用例操作真实系统剪贴板
jobs:
  # 检查项只有一处定义(.github/workflows/verify.yml), ci.yml 与 release.yml
  # 都调它: 发版那条路上的检查不能比平时松, 否则"改了前端忘了重新生成产物"
  # 之类的提交会在打标签时静默过关
  verify:
    uses: ./.github/workflows/verify.yml

  # 发布路径的真实构建 + 资源读回校验, 两种架构各来一遍。
  # 为什么单开一个作业而不是并进 verify: 前端依赖与产物漂移只需跑一次,
  # 而这里要问的是另一个问题 —— .syso 资源在 CI 里生成后有没有真的链进产物。
  # go vet 只做类型检查不链接, go build ./... 在没有 .syso 时也照样成功,
  # 少掉的图标/版本/manifest 要到用户那儿才暴露, 所以必须读回产物逐项核对
  build:
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # 版本号的单一来源是 cmd/type/main.go, 与 build.ps1 同款正则
      - name: 提取版本号
        shell: pwsh
        run: |
          # 必须锚定行首的 `var version =` 且大小写敏感(与 build.ps1 同款): 无锚点的
          # 子串匹配会命中注释里的 `// version = "x"` 或将来某个 `minXxxVersion = "…"`
          $m = @(Select-String -Path cmd/type/main.go -CaseSensitive `
            -Pattern '(?m)^\s*var\s+version\s*=\s*"([\d.]+(?:-[0-9A-Za-z.]+)?)"')
          if ($m.Count -ne 1) { throw "cmd/type/main.go 里应恰好有一处 var version = ""x.y.z"" (实际 $($m.Count) 处)" }
          Add-Content -Path $env:GITHUB_ENV -Value "version=$($m[0].Matches[0].Groups[1].Value)"

      # 资源只在这里生成(.syso 不入库, 见 .gitignore); mkres 两架构一并产出,
      # 后续 go build 按 GOARCH 各取所需, 故本步不能带 GOARCH
      - name: 生成资源 (mkres)
        run: go run ./tools/mkres -version $env:version -icon assets/icon.ico -out cmd/type/version

      # 与 scripts/build.ps1 / README 的发布命令一致(含 -H windowsgui -s -w -trimpath)
      - name: 构建 exe (发布参数, ${{ matrix.arch }})
        shell: pwsh
        run: |
          $env:GOARCH = '${{ matrix.arch }}'
          go build -trimpath -ldflags="-H windowsgui -s -w" -o "Type-${{ matrix.arch }}.exe" ./cmd/type

      - name: 读回校验 (PE 架构 + 图标/版本/manifest)
        run: go run ./tools/pecheck -exe "Type-${{ matrix.arch }}.exe" -version $env:version -arch ${{ matrix.arch }}

      # 测试真跑只在 verify 作业(amd64 原生); arm64 上至少要证明测试代码
      # 也能编译成该架构。以前这里编的是 ./cmd/type —— 那个包现在有契约测试,
      # 但它一度没有测试文件, "go test -c" 会 exit 0 且什么都不产出,
      # 看着全绿其实空转; internal 两个包才是真有测试的地方
      - name: 测试可编译 (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $env:GOARCH = 'arm64'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "arm64 的 go vet 失败" }

          # 只判退出码是不够的: 包里没有测试文件时, go test -c 既不报错也不产出任何
          # 文件, 于是这一步会变成假绿灯(旧坑, 见上面的注释)。所以逐个包编译, 并核对
          # 产物真的存在且非空 —— 每个包用自己的输出名, 免得后一个把前一个覆盖掉
          foreach ($pkg in 'internal/typing', 'internal/win32', 'cmd/type') {
            $out = Join-Path $env:TEMP ('type-arm64-' + ($pkg -replace '[/\\]', '-') + '.test.exe')
            if (Test-Path $out) { Remove-Item $out -Force }
            go test -c -o $out "./$pkg"
            if ($LASTEXITCODE -ne 0) { throw "$pkg 的 arm64 测试编译失败" }
            if (-not (Test-Path $out)) {
              throw "$pkg 没有产出测试二进制: 这个包里是不是没有测试文件? (go test -c 对空包静默成功)"
            }
            if ((Get-Item $out).Length -eq 0) { throw "$pkg 的测试二进制是空文件" }
          }
          Write-Host "三个包的 arm64 测试二进制均已产出并校验非空"
