name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 全流程在 Windows 上跑: 代码带 windows && (amd64 || arm64) 构建约束,
# 且 main_test.go 里有两个用例操作真实系统剪贴板
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          # Node 主版本只写在 .node-version 一处: 产品的字节级可复现性依赖它
          # (换主版本会改变 vite/rollup 产出的转义与 chunk 命名, 见产物漂移检查),
          # 开发者的 nvm/fnm 也读同一个文件, 两边不会各写一份而走散
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── Go 三件套 ──
      - name: gofmt
        shell: pwsh
        run: |
          $bad = gofmt -l ./cmd ./internal ./tools
          if ($bad) { Write-Host "以下文件未格式化:"; $bad; exit 1 }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      # 全部包的快速编译冒烟: 真正带资源链接的发布构建在下面的 build 作业
      - name: go build
        run: go build ./...

      # ── 入库的前端产物必须与源码一致 ──
      # dist/index.html 入库是刻意的(免 Node 亦可 go build), 代价是改了
      # frontend/src 却忘了重新构建时 go:embed 会静默用旧界面, 这里堵住。
      # 比对用 git hash-object --path=<原路径>: 它套用与 git diff 相同的
      # 行尾归一, 因此 Windows 检出(autocrlf 使 CRLF)与 vite 产出(LF)
      # 不会误报, 而真实的内容漂移照样能被抓住(直接比字节或比哈希都会误报,
      # 第一版就是栽在这里)
      - name: 前端依赖
        run: npm ci
        working-directory: frontend

      - name: 前端产物漂移检查
        shell: pwsh
        run: |
          $artifact = 'internal/web/dist/index.html'
          $committed = git rev-parse "HEAD:$artifact"
          if ($LASTEXITCODE -ne 0 -or -not $committed) {
            Write-Host "无法从 HEAD 读取入库产物 $artifact"; exit 1
          }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $built = git hash-object "--path=$artifact" $artifact
          if ($LASTEXITCODE -ne 0 -or -not $built) {
            Write-Host "重新构建未产出 $artifact"; exit 1
          }
          if ($built -ne $committed) {
            Write-Host "$artifact 与 frontend/src 不一致"
            Write-Host "  入库版本: $committed"
            Write-Host "  重新构建: $built"
            Write-Host "  环境: node $(node --version) / vite $((npm ls vite --depth=0 --json 2>$null | ConvertFrom-Json).dependencies.vite.version)"
            Write-Host "请在本地运行 scripts/build.ps1 并提交重新生成的产物"
            exit 1
          }
          Write-Host "前端产物与源码一致 ($committed)"

      # ── 版本同步须为幂等: 否则每次构建都会留下未提交改动 ──
      # 资源里的版本由 tools/mkres 在构建期生成, 没有入库的第二份版本载体,
      # 于是这里只剩 package.json 需要校验
      - name: 版本同步幂等性
        shell: pwsh
        run: |
          # 与 build.ps1 同款正则: 版本可带预发布后缀(如 1.5.0-rc.1),
          # 校验完整字符串确实同步到了产物文件
          $ver = (Select-String -Path cmd/type/main.go -Pattern 'version\s*=\s*"([\d.]+(?:-[0-9A-Za-z.]+)?)"').Matches[0].Groups[1].Value
          $f = 'frontend/package.json'
          $text = [System.IO.File]::ReadAllText($f)
          if ($text -notmatch [regex]::Escape($ver)) { Write-Host "$f 未同步到版本 $ver"; exit 1 }
          Write-Host "版本号 $ver 已同步到 $f"

  # 发布路径的真实构建 + 资源读回校验, 两种架构各来一遍。
  # 为什么单开一个作业而不是并进 verify: 前端依赖与产物漂移只需跑一次,
  # 而这里要问的是另一个问题 —— .syso 资源在 CI 里生成后有没有真的链进产物。
  # go vet 只做类型检查不链接, go build ./... 在没有 .syso 时也照样成功,
  # 少掉的图标/版本/manifest 要到用户那儿才暴露, 所以必须读回产物逐项核对
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # 版本号的单一来源是 cmd/type/main.go, 与 build.ps1 同款正则
      - name: 提取版本号
        shell: pwsh
        run: |
          $m = Select-String -Path cmd/type/main.go -Pattern 'version\s*=\s*"([\d.]+(?:-[0-9A-Za-z.]+)?)"'
          if (-not $m) { throw "cmd/type/main.go 中未找到 version 变量" }
          Add-Content -Path $env:GITHUB_ENV -Value "version=$($m.Matches[0].Groups[1].Value)"

      # 资源只在这里生成(.syso 不入库, 见 .gitignore); mkres 两架构一并产出,
      # 后续 go build 按 GOARCH 各取所需, 故本步不能带 GOARCH
      - name: 生成资源 (mkres)
        run: go run ./tools/mkres -version $env:version -icon assets/icon.ico -out cmd/type/version

      # 与 scripts/build.ps1 / README 的发布命令一致(含 -H windowsgui -s -w)
      - name: 构建 exe (发布参数, ${{ matrix.arch }})
        shell: pwsh
        run: |
          $env:GOARCH = '${{ matrix.arch }}'
          go build -ldflags="-H windowsgui -s -w" -o "Type-${{ matrix.arch }}.exe" ./cmd/type

      - name: 读回校验 (PE 架构 + 图标/版本/manifest)
        run: go run ./tools/pecheck -exe "Type-${{ matrix.arch }}.exe" -version $env:version -arch ${{ matrix.arch }}

      # 测试真跑只在 verify 作业(amd64 原生); arm64 上至少要证明测试代码
      # 也能编译 —— go vet 连同 _test.go 一起类型检查, go test -c 只编译
      # 不运行, 产物丢到临时目录不落进工作区
      - name: 测试可编译 (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $env:GOARCH = 'arm64'
          go vet ./...
          go test -c -o "$env:TEMP\type-arm64.test.exe" ./cmd/type
